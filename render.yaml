# SHIMAI — Render Blueprint
# Dashboard → New → Blueprint → this repo.
# After first deploy, set Edge Function secrets in Supabase:
#   SHIMAI_APP_URL = https://<this-service>.onrender.com
#   SHIMAI_ALLOWED_ORIGINS = https://<this-service>.onrender.com
# Push retry worker: Supabase Edge Function `push-dispatch` (pg_cron every minute).
# Apply migration 00019_push_dispatch_cron.sql and deploy the function.

services:
  - type: web
    name: shimai
    runtime: node
    region: ohio
    plan: starter
    buildCommand: NODE_OPTIONS=--max-old-space-size=1024 NPM_CONFIG_PRODUCTION=false npm ci --include=dev && npm run build && cp -r public .next/standalone/ && cp -r .next/static .next/standalone/.next/
    startCommand: node .next/standalone/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_OPTIONS
        value: --max-old-space-size=384
      # Keep devDependencies available during `next build` (Tailwind, TypeScript).
      - key: NPM_CONFIG_PRODUCTION
        value: "false"

      - key: SHIMAI_APP_URL
        fromService:
          name: shimai
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: NEXT_PUBLIC_SITE_URL
        fromService:
          name: shimai
          type: web
          envVarKey: RENDER_EXTERNAL_URL

      - key: NEXT_PUBLIC_SUPABASE_URL
        value: https://ikxbuqebgbeciznedgkj.supabase.co
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        value: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlreGJ1cWViZ2JlY2l6bmVkZ2tqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjkzMDYwOTksImV4cCI6MjA4NDg4MjA5OX0.cGi9MEYceZzewsqltnz7nKBjM5ZKW0p3aZMxcgF0uz8
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        value: sb_publishable_71ulZwafUKOO3MUvkEyszg_-pB3yWu2

      # Prompted in Render on first Blueprint apply. Copy from
      # Supabase → Project Settings → API → service_role (JWT, starts with eyJ).
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

      # Google Maps (Axius) — Places + Geocoding + Maps JavaScript API
      - key: GOOGLE_MAPS_API_KEY
        sync: false

      # Optional: manual POST /api/push/dispatch in development
      - key: CRON_SECRET
        generateValue: true
